<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Awesome Capacitor App</title>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <script type="module" src="https://unpkg.com/@ionic/pwa-elements@latest/dist/ionicpwaelements/ionicpwaelements.esm.js"></script>
    <script nomodule src="https://unpkg.com/@ionic/pwa-elements@latest/dist/ionicpwaelements/ionicpwaelements.js"></script>

    <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="theme-color" content="#31d53d" />
    <link rel="stylesheet" href="leaflet/leaflet.css" />

  </head>

  <body>

    <div id="accuracy-badge">
      <div id="accuracy-dot"></div>
      <span id="accuracy-text">⏳ جارٍ الاتصال...</span>
    </div>

    <div id="map"></div>

    <div id="danger-badge">
      <div class="badge-icon">⚠️</div>
      <div class="badge-text">
        <h3>انتباه! خطر اصطدام</h3>
        <p id="badge-distance">المسافة: -- متر</p>

      </div>
    </div>

        <!-- Badge 5km — orange, plus petit, avertissement -->
    <div id="danger-badge">
      <div class="badge-icon">🔔</div>
      <div class="badge-text">
        <h3>تنبيه! مركبة قريبة</h3>
        <p id="badge-distance">المسافة: -- متر</p>
      </div>
    </div>

    <script src="leaflet/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>
    <script src="js/AlarmPlaying.js"></script>
    <script src="js/AlarmPlaying-5k.js"></script>
    <script src="js/RelativeDirection.js"></script>
    <script src="js/Bearing.js"></script>
    <script src="js/FormatSpeed.js"></script>
    <script src="js/ShowDangerBadge.js"></script>
    <script src="js/UpdateBadge.js"></script>
    <script src="js/ConnectingToServer.js"></script>
    <script src="js/Gps&Tracking.js"></script>
    <script src="js/showOfflineBadge.js"></script>
    <script>
      
      const { SplashScreen } = Capacitor.Plugins;
      window.addEventListener('DOMContentLoaded', async () => {
        await SplashScreen.hide();
      });

      // ── MAP ────────────────────────────────────────────────
      const map = L.map('map').setView([18.0858, -15.9785], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      const customIcon = L.icon({
        iconUrl: 'leaflet/images/marker-icon.png',
        iconSize: [40, 55], iconAnchor: [20, 55], popupAnchor: [0, -55]
      });

      // ── USER ID ────────────────────────────────────────────
      let userId = localStorage.getItem('trafficUserId');

      if (!userId) {
        userId = Math.random().toString(36).substring(2, 9);
        localStorage.setItem('trafficUserId', userId);
      }

      // ── STATE ──────────────────────────────────────────────
      const markers        = new Map();
      let accuracyCircle   = null;
      let testMarker       = null;
      let lastAccuracy     = null;
      let socketReady      = false;
      let userPositionReceived = false;
      let warningTimer100 = null;  // timer pour badge 100m
      let warningTimer5k  = null;  // timer pour badge 5km
      let trackingStarted  = false;  // prevent double GPS watcher
      let myHeading        = null;
      let myLat            = null;
      let myLng            = null;
      let myCurrentSpeed   = null;

      const FALLBACK_LAT   = 18.0858;
      const FALLBACK_LNG   = -15.9785;


      socket.on('disconnect', () => {
        socketReady = false;
        console.warn('⚠️ Disconnected');
        updateBadge();
      });

      socket.on('connect_error', (error) => {
        socketReady = false;
        console.error('❌ Socket.IO Error:', error);
        updateBadge();
      });

      socket.on('update', (users) => {
        console.log('📍 Snapshot:', users.length, 'users');
        const activeIds = new Set(users.map(u => u.id));

        for (const [id, marker] of markers) {
          if (!activeIds.has(id)) {
            map.removeLayer(marker);
            markers.delete(id);
          }
        }

        users.forEach(user => {
          const pos   = [user.lat, user.lng];
          const popup = `ID: ${user.id}<br/>LAT: ${user.lat.toFixed(6)}<br/>LNG: ${user.lng.toFixed(6)}`;
          if (!markers.has(user.id)) {
            const m = L.marker(pos, { icon: customIcon }).addTo(map);
            m.bindPopup(popup);
            markers.set(user.id, m);
            if (user.id === userId && !userPositionReceived) {
              userPositionReceived = true;
              map.setView(pos, 17);
            }
          } else {
            markers.get(user.id).setLatLng(pos).setPopupContent(popup);
          }
        });
      });

      // warning 100m → badge rouge urgent
      socket.on('warning', (data) => {
        console.warn('🚨 WARNING 100m — distance:', data.distance, 'm');
        showBadge100(data);
      });

      // warning 5km → badge orange doux
      socket.on('warning-5k', (data) => {
        console.warn('🔔 WARNING 5km — distance:', data.distance, 'm');
        showBadge5k(data);
      });

      socket.on('offline-warning', (offlineUsers) => {
        offlineUsers.forEach(user => {
          const minutesAgo = Math.round((Date.now() - user.timestamp) / 60000);
          const dist = getDistance(myLat, myLng, user.lat, user.lng);
          
            showOfflineBadge(dist, minutesAgo);
          
        });
      });
      // safe 100m → cache uniquement le badge rouge
      // le badge 5km continue à s'afficher si toujours dans 5km
      socket.on('safe-100m', () => {
        console.log('✅ Safe 100m — badge rouge caché');
        clearTimeout(warningTimer100);
        document.getElementById('danger-badge-100').classList.remove('show-badge');
        // badge 5km reste visible ← rien ne le touche ici
      });

      // safe 5km → cache les deux badges
      // car si on sort de 5km on est complètement en sécurité
      socket.on('safe-5k', () => {
        console.log('✅ Safe 5km — tous les badges cachés');
        clearTimeout(warningTimer100);
        clearTimeout(warningTimer5k);
        document.getElementById('danger-badge-100').classList.remove('show-badge');
        document.getElementById('danger-badge-5k').classList.remove('show-badge');
      });


    
      socket.on('connect', () => {
        socketReady = true;
        console.log('✅ Connected | userId:', userId);
        updateBadge();

      
         
     
        if (!trackingStarted) {
          trackingStarted = true;
          startTracking();
          
        }
      });

    </script>
  </body>
</html>
