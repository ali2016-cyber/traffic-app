<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Awesome Capacitor App</title>
    <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <script type="module" src="https://unpkg.com/@ionic/pwa-elements@latest/dist/ionicpwaelements/ionicpwaelements.esm.js"></script>
    <script nomodule src="https://unpkg.com/@ionic/pwa-elements@latest/dist/ionicpwaelements/ionicpwaelements.js"></script>

    <link rel="icon" type="image/x-icon" href="assets/icon/favicon.ico" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="stylesheet" href="./css/style.css" />
    <meta name="theme-color" content="#31d53d" />
    <link rel="stylesheet" href="leaflet/leaflet.css" />

    <style>
      html, body { height: 100%; margin: 0; font-family: Arial, sans-serif; }
      #map { height: 100%; width: 100%; }

      #accuracy-badge {
        position: fixed; top: 12px; right: 12px; z-index: 9999;
        background: rgba(0,0,0,0.75); color: white;
        padding: 8px 14px; border-radius: 20px; font-size: 13px;
        display: flex; align-items: center; gap: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      }
      #accuracy-dot {
        width: 10px; height: 10px; border-radius: 50%;
        background: gray; flex-shrink: 0;
      }

      #start-btn {
        position: fixed; bottom: 24px; left: 50%;
        transform: translateX(-50%);
        z-index: 9999; background: #22c55e; color: white;
        border: none; border-radius: 30px;
        padding: 14px 32px; font-size: 16px; font-weight: bold;
        cursor: pointer; box-shadow: 0 4px 15px rgba(34,197,94,0.5);
        transition: opacity 0.4s, transform 0.4s;
      }
      #start-btn.hidden {
        opacity: 0; pointer-events: none;
        transform: translateX(-50%) scale(0.8);
      }

      #danger-badge {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%, -50%) scale(0.8);
        background: linear-gradient(135deg, #ff416c, #ff4b2b);
        color: white; padding: 20px 30px; border-radius: 15px;
        box-shadow: 0 15px 30px rgba(255,0,0,0.4);
        z-index: 9999; display: flex; align-items: center; gap: 15px;
        opacity: 0; visibility: hidden;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        direction: rtl; min-width: 280px; line-height: 1.8;
      }
      #danger-badge.show-badge {
        opacity: 1; visibility: visible;
        transform: translate(-50%, -50%) scale(1);
      }
      .badge-icon { font-size: 45px; animation: pulse-icon 1s infinite alternate; }
      .badge-text h3 { margin: 0 0 5px; font-size: 24px; font-weight: bold; }
      .badge-text p  { margin: 0; font-size: 15px; }
      @keyframes pulse-icon {
        from { transform: scale(1); }
        to   { transform: scale(1.2); }
      }
    </style>
  </head>

  <body>

    <div id="accuracy-badge">
      <div id="accuracy-dot"></div>
      <span id="accuracy-text">⏳ جارٍ الاتصال...</span>
    </div>

    <div id="map"></div>

    <div id="danger-badge">
      <div class="badge-icon">⚠️</div>
      <div class="badge-text">
        <h3>انتباه! خطر اصطدام</h3>
        <p id="badge-distance">المسافة: -- متر</p>
      </div>
    </div>

    <button id="start-btn" onclick="unlockAudio()">▶ ابدأ التتبع</button>

    <script src="leaflet/leaflet.js"></script>
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"></script>

    <script>
      const { SplashScreen } = Capacitor.Plugins;
      window.addEventListener('DOMContentLoaded', async () => {
        await SplashScreen.hide();
      });

      // ── MAP ────────────────────────────────────────────────
      const map = L.map('map').setView([18.0858, -15.9785], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19
      }).addTo(map);

      const customIcon = L.icon({
        iconUrl: 'leaflet/images/marker-icon.png',
        iconSize: [40, 55], iconAnchor: [20, 55], popupAnchor: [0, -55]
      });

      // ── USER ID ────────────────────────────────────────────
      let userId = localStorage.getItem('trafficUserId');
      if (!userId) {
        userId = Math.random().toString(36).substring(2, 9);
        localStorage.setItem('trafficUserId', userId);
      }

      // ── STATE ──────────────────────────────────────────────
      const markers        = new Map();
      let accuracyCircle   = null;
      let testMarker       = null;
      let lastAccuracy     = null;
      let socketReady      = false;
      let userPositionReceived = false;
      let warningTimer     = null;
      let trackingStarted  = false;  // FIX 4: prevent double GPS watcher
      let myHeading        = null;
      let myLat            = null;
      let myLng            = null;
      let myCurrentSpeed   = null;

      const FALLBACK_LAT   = 18.0858;
      const FALLBACK_LNG   = -15.9785;

      // ── AUDIO ──────────────────────────────────────────────
      let audioCtx      = null;
      let audioUnlocked = false;

      function unlockAudio() {
        if (audioUnlocked) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume().then(() => {
          audioUnlocked = true;
          console.log('🔊 AudioContext unlocked');
          document.getElementById('start-btn').classList.add('hidden');
        });
      }

      function playAlarm() {
        if (!audioUnlocked || !audioCtx) {
          console.warn('🔇 Audio not unlocked yet');
          return;
        }
        const snd = new Audio('warning.mp3');
        snd.play().catch(e => console.warn('Audio blocked:', e));
      }

      // ── MATH HELPERS ───────────────────────────────────────
      function getBearing(lat1, lng1, lat2, lng2) {
        const toRad = d => d * Math.PI / 180;
        const toDeg = r => r * 180 / Math.PI;
        const dLng  = toRad(lng2 - lng1);
        const y = Math.sin(dLng) * Math.cos(toRad(lat2));
        const x = Math.cos(toRad(lat1)) * Math.sin(toRad(lat2))
                - Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(dLng);
        return (toDeg(Math.atan2(y, x)) + 360) % 360;
      }

      function getRelativeDirection(heading, bearingToOther) {
        if (heading === null) return '📍 قريب منك';
        const diff = (bearingToOther - heading + 360) % 360;
        if (diff <= 45 || diff >= 315)       return '⬆️ أمامك';
        else if (diff >= 135 && diff <= 225) return '⬇️ خلفك';
        else if (diff > 45  && diff < 135)  return '➡️ على يمينك';
        else                                 return '⬅️ على يسارك';
      }

      function formatSpeed(speedMs) {
        if (speedMs === null || speedMs < 0) return '-- كم/س';
        return `${Math.round(speedMs * 3.6)} كم/س`;
      }

      // ── DANGER BADGE ───────────────────────────────────────
      function showDangerBadge(data) {
        const badge    = document.getElementById('danger-badge');
        const distText = document.getElementById('badge-distance');

        let direction = '📍 قريب منك';
        if (myLat !== null && data.otherLat) {
          const bearing = getBearing(myLat, myLng, data.otherLat, data.otherLng);
          direction = getRelativeDirection(myHeading, bearing);
        }

        distText.innerHTML = `
          📏 المسافة: <b>${Math.round(data.distance)} متر</b><br/>
          ${direction}<br/>
          🚗 سرعتك: <b>${formatSpeed(myCurrentSpeed)}</b><br/>
          🚙 سرعته: <b>${formatSpeed(data.otherSpeed)}</b>
        `;

        badge.classList.add('show-badge');
        playAlarm();
        clearTimeout(warningTimer);
        warningTimer = setTimeout(() => {
          badge.classList.remove('show-badge');
        }, 3500);
      }

      // ── ACCURACY BADGE ─────────────────────────────────────
      function updateBadge() {
        const dot = document.getElementById('accuracy-dot');
        const txt = document.getElementById('accuracy-text');
        if (!socketReady) {
          dot.style.background = '#ef4444';
          txt.textContent = '❌ لا يوجد اتصال بالسيرفر';
          return;
        }
        if (lastAccuracy === null) {
          dot.style.background = '#6b7280';
          txt.textContent = '⏳ في انتظار GPS...';
          return;
        }
        if (lastAccuracy < 50) {
          dot.style.background = '#22c55e';
          txt.textContent = `📡 GPS دقيق: ${Math.round(lastAccuracy)} متر`;
        } else if (lastAccuracy < 300) {
          dot.style.background = '#f59e0b';
          txt.textContent = `📡 دقة مقبولة: ${Math.round(lastAccuracy)} متر`;
        } else {
          dot.style.background = '#6b7280';
          txt.textContent = `⚠️ دقة ضعيفة: ${Math.round(lastAccuracy)} متر`;
        }
      }

      // ── SOCKET.IO ──────────────────────────────────────────
      // FIX 1: added https://
      const serverUrl = "https://node-js-production-4477.up.railway.app";
      console.log('🔗 Connecting to:', serverUrl);

      const socket = io(serverUrl, {
        transports: ['websocket'],
        upgrade: false,
        reconnectionAttempts: 5
      });

      socket.on('disconnect', () => {
        socketReady = false;
        console.warn('⚠️ Disconnected');
        updateBadge();
      });

      socket.on('connect_error', (error) => {
        socketReady = false;
        console.error('❌ Socket.IO Error:', error);
        updateBadge();
      });

      socket.on('update', (users) => {
        console.log('📍 Snapshot:', users.length, 'users');
        const activeIds = new Set(users.map(u => u.id));

        for (const [id, marker] of markers) {
          if (!activeIds.has(id)) {
            map.removeLayer(marker);
            markers.delete(id);
          }
        }

        users.forEach(user => {
          const pos   = [user.lat, user.lng];
          const popup = `ID: ${user.id}<br/>LAT: ${user.lat.toFixed(6)}<br/>LNG: ${user.lng.toFixed(6)}`;
          if (!markers.has(user.id)) {
            const m = L.marker(pos, { icon: customIcon }).addTo(map);
            m.bindPopup(popup);
            markers.set(user.id, m);
            if (user.id === userId && !userPositionReceived) {
              userPositionReceived = true;
              map.setView(pos, 17);
            }
          } else {
            markers.get(user.id).setLatLng(pos).setPopupContent(popup);
          }
        });
      });

      socket.on('warning', (data) => {
        console.warn('🚨 WARNING — distance:', data.distance, 'm');
        showDangerBadge(data);
      });

      // FIX 3: handle safe event to clear the badge
      socket.on('safe', () => {
        console.log('✅ Safe — clearing warning badge');
        clearTimeout(warningTimer);
        document.getElementById('danger-badge').classList.remove('show-badge');
      });

      // ── GPS FUNCTIONS ───────────────────────────────────────
      function sendPosition(lat, lng, speed = 0, heading = null) {
        if (socketReady) {
          socket.emit('positionUpdate', { id: userId, lat, lng, speed, heading });
        } else {
          setTimeout(() => sendPosition(lat, lng, speed, heading), 1000);
        }
      }

      async function startTracking() {
        const { BackgroundGeolocation } = Capacitor.Plugins;
        await BackgroundGeolocation.addWatcher(
          {
            backgroundMessage: "التطبيق يتابع موقعك في الخلفية",
            backgroundTitle:   "نظام تنبيه المرور",
            requestPermissions: true,
            stale: false,
            distanceFilter: 0
          },
          (location, error) => {
            if (error) { console.error('❌ BG GPS:', error); return; }

            const lat      = location.latitude;
            const lng      = location.longitude;
            const accuracy = location.accuracy;
            const speed    = location.speed   ?? 0;
            const heading  = location.bearing ?? null;

            myCurrentSpeed = speed;
            myHeading      = heading;
            myLat          = lat;
            myLng          = lng;

            lastAccuracy = accuracy;
            updateBadge();

            if (accuracyCircle) map.removeLayer(accuracyCircle);
            accuracyCircle = L.circle([lat, lng], {
              radius: accuracy, color: 'blue',
              fillColor: '#30b0ff', fillOpacity: 0.1, weight: 2
            }).addTo(map);

            if (testMarker) map.removeLayer(testMarker);
            testMarker = L.marker([lat, lng], {
              icon: L.icon({
                iconUrl: 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjQiIGhlaWdodD0iMjQiIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSIxMiIgY3k9IjEyIiByPSI5IiBmaWxsPSJyZWQiIHN0cm9rZT0id2hpdGUiIHN0cm9rZS13aWR0aD0iMiIvPjwvc3ZnPg==',
                iconSize: [24, 24], iconAnchor: [12, 12]
              }),
              zIndexOffset: 1000
            }).addTo(map);

            if (!userPositionReceived) {
              userPositionReceived = true;
              map.setView([lat, lng], 17);
            }

            sendPosition(lat, lng, speed, heading);
          }
        );
      }

      function startBrowserGPS() {
        navigator.geolocation.watchPosition(
          (position) => {
            const { latitude: lat, longitude: lng, accuracy } = position.coords;
            lastAccuracy = accuracy;
            updateBadge();
            if (accuracyCircle) map.removeLayer(accuracyCircle);
            accuracyCircle = L.circle([lat, lng], {
              radius: accuracy, color: 'blue',
              fillColor: '#30b0ff', fillOpacity: 0.1, weight: 2
            }).addTo(map);
            sendPosition(lat, lng);
          },
          (error) => {
            console.error('❌ GPS error:', error.message);
            setInterval(() => sendPosition(FALLBACK_LAT, FALLBACK_LNG), 1000);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      }

      // FIX 2: socket.on('connect') is now top-level, outside any if/else block
      // FIX 4: trackingStarted guard prevents double GPS watcher on reconnect
      socket.on('connect', () => {
        socketReady = true;
        console.log('✅ Connected | userId:', userId);
        updateBadge();

        if (!trackingStarted) {
          trackingStarted = true;
          if (window.Capacitor?.isNativePlatform()) {
            startTracking();
          } else {
            startBrowserGPS();
          }
        }
      });

    </script>
  </body>
</html>
